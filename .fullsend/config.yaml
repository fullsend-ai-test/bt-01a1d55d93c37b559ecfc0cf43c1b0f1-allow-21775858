      source: https://raw.githubusercontent.com/fullsend-ai-test/bt-01a1d55d93c37b559ecfc0cf43c1b0f1-allow-21775858-url-harness-host/main/harness/url-ping.yaml#sha256=c461b31687d64b92429e4c340fab4960d883720b85233a39ca719d9a640e42fb
